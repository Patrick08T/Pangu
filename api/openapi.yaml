        '200':
          description: 操作后的调试状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DebugState'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
components:
  parameters:
    ExperienceCSRF:
      name: X-CSRF-Token
      in: header
      required: true
      schema: {type: string}
    ExperienceVersionID:
      name: version
      in: path
      required: true
      schema: {type: string, format: uuid}
    EvolutionIntentID:
      name: intent
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExperienceCursor:
      name: cursor
      in: query
      schema: {type: string}
    ExperienceLimit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 50}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    Workflow:
      required: true
      description: 请求体最多 256 KiB；字节限制和依赖完整性由服务端校验
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Workflow'
  responses:
    Preflight:
      description: 在实际 Worker 检查环境；Eino configured 不代表凭据或模型可用，未发送收费请求
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Preflight'
              - $ref: '#/components/schemas/Error'
    Error:
      description: 请求或服务错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Readiness:
      description: 产品数据库连接/迁移与 Hatchet 编排注册；不检查在线 Worker、模型和工作目录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Readiness'
  schemas:
    ExperienceBudget:
      type: object
      additionalProperties: false
      properties:
        calls: {type: integer, format: int64, minimum: 0}
        tokens: {type: integer, format: int64, minimum: 0}
    ExperienceEvaluationPolicy:
      type: object
      additionalProperties: false
      properties:
        suite_version: {type: string}
        protection_set: {type: string}
        holdout_set: {type: string}
        grouping: {type: string}
        repeats: {type: integer, minimum: 0}
        minimum_samples: {type: integer, minimum: 0}
        primary_metric: {type: string, enum: ['', acceptance, rework, cost, duration], description: 启用时只接受 capabilities.supported_metrics 中的真实可测指标}
        minimum_improvement: {type: number}
        non_inferiority: {type: number, nullable: true}
        uncertainty_method: {type: string}
        confidence: {type: number}
        max_candidates: {type: integer, minimum: 0}
        multiple_comparison: {type: string}
        resource_tolerance: {type: number, nullable: true}
    ExperienceDeliveryPolicy:
      type: object
      additionalProperties: false
      properties:
        mode: {type: string, enum: ['', shadow, canary, serving, paused]}
