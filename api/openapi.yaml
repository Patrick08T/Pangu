          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              name: {type: string, description: 节点显示名称，最多 128 字节}
              x: {type: number, minimum: -1000000, maximum: 1000000}
              y: {type: number, minimum: -1000000, maximum: 1000000}
            required: [x, y]
        viewport:
          type: object
          additionalProperties: false
          properties:
            x: {type: number, minimum: -1000000, maximum: 1000000}
            y: {type: number, minimum: -1000000, maximum: 1000000}
            zoom: {type: number, minimum: 0.1, maximum: 2}
          required: [x, y, zoom]
      description: 仅用于画布展示，与草稿及发布版本一起保存，执行编译忽略。
    Flow:
