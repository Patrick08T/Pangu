      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Schedule'
        next_offset:
          type: integer
          minimum: 0
      required:
        - items
    AuditEntry:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        actor_id:
          type: string
          format: uuid
        token_id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        action:
          type: string
        object_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        result_id:
          type: string
          format: uuid
        result_version:
          type: integer
        outcome:
