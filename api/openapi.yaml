openapi: 3.0.3
info:
  title: Pangu 本地 API
  version: 0.1.0
  description: Pangu Agent 工厂 API。业务接口使用飞书会话或项目 API Token；GitHub 接收入口独立验证 HMAC 签名。人工审批、采纳和证据核验要求飞书会话。配置权限与会话每次查询原始数据库。
servers:
  - url: /api
paths:
  /factory/sessions:
    get:
      operationId: listFactorySessions
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: 当前项目的工厂对话
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactorySessionPage'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createFactorySession
      parameters:
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_id]
              properties:
                project_id: {type: string, format: uuid}
      responses:
        '201':
          description: 已创建空对话，不调用模型
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactorySession'}
        '403': {$ref: '#/components/responses/Error'}
  /factory/sessions/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: getFactorySession
      responses:
        '200':
          description: 对话、候选与创建回执；同步已完成生成结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactorySession'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /factory/sessions/{id}/messages:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    post:
      operationId: generateFactoryProposal
      parameters:
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FactoryInput'}
      responses:
        '202':
          description: 单次受限生成任务已保存，消息 ID 用于幂等重试
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Submission'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /factory/sessions/{id}/apply:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    post:
      operationId: applyFactoryProposal
      parameters:
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [turn_id, revision]
              properties:
                turn_id: {type: string, format: uuid}
                revision: {type: integer, minimum: 1}
      responses:
        '200':
          description: 原子创建并发布回执，不运行；同一候选重复请求返回原回执
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactoryResult'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /runs/{id}/fork:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    post:
      operationId: forkRun
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForkInput'}
      responses:
        '202':
          description: 基于成功串行 Codex 前缀的独立返工运行
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Submission'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /runs/{id}/fork/preview:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    post:
      operationId: previewFork
      parameters:
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForkInput'}
      responses:
        '200':
          description: 复用与重新执行的影响范围；最终提交还会检查源工作区
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForkPreview'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /runs/{id}/inputs:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: runInputs
      responses:
        '200':
          description: 根据当前已成功上游输出解析参数和分支；未就绪字段不猜测
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/InputPreview'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /workflows/preview:
    post:
      operationId: previewInputs
      parameters:
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Workflow'}
      responses:
        '200':
          description: 不调用 Agent 的输入预览与错误定位
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/InputPreview'}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /github/hooks:
    get:
      operationId: listGithubHooks
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: 项目管理者可见的事件入口
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GithubHookPage'}
        '403': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
    post:
      operationId: createGithubHook
      parameters:
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GithubHookConfig'}
      responses:
        '201':
          description: 固定配置的已启用入口；变更请停用后新建
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GithubHook'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /github/hooks/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    delete:
      operationId: disableGithubHook
      parameters:
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      responses:
        '204': {description: 已停用，已接受的提交继续执行}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /github/hooks/{id}/events:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: githubEvents
      parameters:
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: 事件与回执追踪
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GithubEventPage'}
        '403': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /hooks/github/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    post:
      operationId: receiveGithubIssue
      security: []
      description: 独立 HMAC-SHA256 认证，仅接收固定仓库与标签的 issues labeled 事件；原始体最多 256 KiB，Issue 正文最多 12000 字节。
      parameters:
        - {name: X-Hub-Signature-256, in: header, required: true, schema: {type: string}}
        - {name: X-GitHub-Delivery, in: header, required: true, schema: {type: string, format: uuid}}
        - {name: X-GitHub-Event, in: header, required: true, schema: {type: string, enum: [issues]}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '202':
          description: 已在同一事务中记录事件与提交意图，可查询回执
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Submission'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /runs/{id}/usage:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: runUsage
      parameters:
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: 原子预留额度及提供方返回的用量；金额只作估算，无账单实值
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UsageReport'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /runs/{id}/reports/{report}/deliveries:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: report, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: createDelivery
      description: 从已成功的设计报告固定选中任务与实施/只读审查版本；不会自动批准或执行。
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeliveryInput'}
      responses:
        '201':
          description: 固定交付草案
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Delivery'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /deliveries:
    get:
      operationId: listDeliveries
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: 交付草案列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryPage'}
        '403': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /deliveries/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: getDelivery
      responses:
        '200':
          description: 交付草案与运行回执
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Delivery'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /deliveries/{id}/run:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    post:
      operationId: runDelivery
      description: 每份草案只产生一个幂等运行，实施节点仍需飞书人工批准。
      parameters:
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [subject_hash]
              properties:
                subject_hash: {type: string}
      responses:
        '202':
          description: 交付运行回执
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Submission'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /deliveries/{id}/artifacts.zip:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: exportDelivery
      responses:
        '200':
          description: 已验证、审查并由人采纳的交付 ZIP
          content:
            application/zip:
              schema: {type: string, format: binary}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /runs/{id}/reports:
    parameters:
      -
        "$ref": "#/components/parameters/ID"
    get:
      operationId: "listReports"
      responses:
        200:
          description: "报告证据及人工核验"
          content:
            application/json:
              schema:
                type: "array"
                items:
                  "$ref": "#/components/schemas/ReportDetail"
        400:
          "$ref": "#/components/responses/Error"
        401:
          "$ref": "#/components/responses/Error"
        403:
          "$ref": "#/components/responses/Error"
        404:
          "$ref": "#/components/responses/Error"
        409:
          "$ref": "#/components/responses/Error"
        502:
          "$ref": "#/components/responses/Error"
  /runs/{id}/reports/{report}/claims/{claim}:
    parameters:
      -
        "$ref": "#/components/parameters/ID"
      -
        name: "report"
        in: "path"
        required: true
        schema:
          type: "string"
          format: "uuid"
      -
        name: "claim"
        in: "path"
        required: true
        schema:
          type: "string"
    put:
      operationId: "reviewClaim"
      parameters:
        -
          name: "X-CSRF-Token"
          in: "header"
          schema:
            type: "string"
      description: "运行所有者或管理者按报告摘要与修订号登记人工核验；核验记录随报告正文清理。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ClaimReviewInput"
      responses:
        200:
          description: "报告证据及人工核验"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ClaimReview"
        400:
          "$ref": "#/components/responses/Error"
        401:
          "$ref": "#/components/responses/Error"
        403:
          "$ref": "#/components/responses/Error"
        404:
          "$ref": "#/components/responses/Error"
        409:
          "$ref": "#/components/responses/Error"
        502:
          "$ref": "#/components/responses/Error"
  /runs/{id}/approvals:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listApprovals
      responses:
        '200':
          description: 运行中的节点审批，最多 32 项；正文随运行清理
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ApprovalGate'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /approvals/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    put:
      operationId: decideApproval
      description: 飞书会话中的运行所有者或管理者批准/驳回；开始执行前可以撤回批准。API Token 不可代替人工审批。
      parameters:
        - {name: X-CSRF-Token, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecision'}
      responses:
        '200':
          description: 决策已持久化，事件交接会重试；执行前重新检查权限、有效期与 Git 检查点
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalGate'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /runs/{id}/feedback:
    parameters:
      -
        "$ref": "#/components/parameters/ID"
    get:
      operationId: "getFeedback"
      responses:
        200:
          description: "获取当前终态运行及产物摘要；运行中的 subject_hash 为空。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/FeedbackState"
        400:
          "$ref": "#/components/responses/Error"
        401:
          "$ref": "#/components/responses/Error"
        403:
          "$ref": "#/components/responses/Error"
        404:
          "$ref": "#/components/responses/Error"
        409:
          "$ref": "#/components/responses/Error"
        410:
          "$ref": "#/components/responses/Error"
        502:
          "$ref": "#/components/responses/Error"
    put:
      operationId: "saveFeedback"
      parameters:
        -
          name: "X-CSRF-Token"
          in: "header"
          schema:
            type: "string"
          description: "浏览器修改请求同时需要正确 Origin；API Token 无此要求。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/FeedbackInput"
      responses:
        200:
          description: "管理者或运行所有者按修订号保存采纳评价；相同重复请求返回原评价。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Feedback"
        400:
          "$ref": "#/components/responses/Error"
        401:
          "$ref": "#/components/responses/Error"
        403:
          "$ref": "#/components/responses/Error"
        404:
          "$ref": "#/components/responses/Error"
        409:
          "$ref": "#/components/responses/Error"
        410:
          "$ref": "#/components/responses/Error"
        502:
          "$ref": "#/components/responses/Error"
  /projects/{id}/quality:
    parameters:
      -
        "$ref": "#/components/parameters/ID"
    get:
      operationId: "projectQuality"
      responses:
        200:
          description: "最近 90 天按稳定任务 ID 去重；采纳取任务最新已评定运行，首次采纳仅计算原始运行首次评价。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Quality"
        400:
          "$ref": "#/components/responses/Error"
        401:
          "$ref": "#/components/responses/Error"
        403:
          "$ref": "#/components/responses/Error"
        404:
          "$ref": "#/components/responses/Error"
        409:
          "$ref": "#/components/responses/Error"
        410:
          "$ref": "#/components/responses/Error"
        502:
          "$ref": "#/components/responses/Error"
  /evaluations/cases:
    get:
      operationId: "listEvaluationCases"
      parameters:
        -
          name: "project_id"
          in: "query"
          required: true
          schema:
            type: "string"
            format: "uuid"
        -
          name: "offset"
          in: "query"
          schema:
            type: "integer"
            minimum: 0
            default: 0
      responses:
        200:
          description: "固定样本列表，过期或停用正文为空。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EvaluationCasePage"
        400:
          "$ref": "#/components/responses/Error"
        401:
          "$ref": "#/components/responses/Error"
        403:
          "$ref": "#/components/responses/Error"
        404:
          "$ref": "#/components/responses/Error"
        409:
          "$ref": "#/components/responses/Error"
        410:
          "$ref": "#/components/responses/Error"
        502:
          "$ref": "#/components/responses/Error"
    post:
      operationId: "createEvaluationCase"
      parameters:
        -
          name: "X-CSRF-Token"
          in: "header"
          schema:
            type: "string"
          description: "浏览器修改请求同时需要正确 Origin；API Token 无此要求。"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/EvaluationCaseInput"
      responses:
        201:
          description: "创建固定样本，正文保留 30 天；变更标准必须创建新样本。"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EvaluationCase"
        400:
          "$ref": "#/components/responses/Error"
        401:
          "$ref": "#/components/responses/Error"
        403:
          "$ref": "#/components/responses/Error"
        404:
          "$ref": "#/components/responses/Error"
        409:
          "$ref": "#/components/responses/Error"
        410:
          "$ref": "#/components/responses/Error"
        502:
          "$ref": "#/components/responses/Error"
  /evaluations/cases/{id}:
    parameters:
      -
        "$ref": "#/components/parameters/ID"
    get:
      operationId: "getEvaluationCase"
      responses:
        200:
          description: "固定样本"
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/EvaluationCase"
        400:
          "$ref": "#/components/responses/Error"
        401:
          "$ref": "#/components/responses/Error"
        403:
          "$ref": "#/components/responses/Error"
        404:
          "$ref": "#/components/responses/Error"
        409:
          "$ref": "#/components/responses/Error"
        410:
          "$ref": "#/components/responses/Error"
        502:
          "$ref": "#/components/responses/Error"
    delete:
      operationId: "retireEvaluationCase"
      parameters:
        -
