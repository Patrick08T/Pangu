                - input
      responses:
        '200':
          description: 配置诊断通过，不代表模型服务调用成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Preflight'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Preflight'
  /runs/{id}/events:
    get:
      operationId: runEvents
      description: 按根运行或其直接子节点分页读取脱敏调度事件，禁止跨运行节点查询。
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: node_run_id
          in: query
          schema:
            type: string
            format: uuid
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 事件分页
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /retention:
    get:
      operationId: previewRetention
      description: 管理员预览当前 Worker 最旧的最多100条候选；活动运行受保护。
      responses:
        '200':
          description: 逐项清理状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
    post:
      operationId: executeRetention
      description: 管理员执行一批清理；每项独立检查终态、租约和托管目录，中断可重试。
      responses:
        '200':
          description: 逐项清理状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      parameters:
        - name: X-CSRF-Token
          in: header
          description: 浏览器会话写操作必须携带；API Token 请求不适用。
          schema:
            type: string
  /retention/history:
    get:
      operationId: listRetentionHistory
      description: 管理员分页查询独立保留180天的清理记录。
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 清理记录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionHistoryPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    Workflow:
      required: true
      description: 请求体最多 256 KiB；字节限制和依赖完整性由服务端校验
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Workflow'
  responses:
    Preflight:
      description: 在实际 Worker 检查环境；Eino configured 不代表凭据或模型可用，未发送收费请求
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Preflight'
              - $ref: '#/components/schemas/Error'
    Error:
      description: 请求或服务错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Readiness:
      description: 产品数据库连接/迁移与 Hatchet 编排注册；不检查在线 Worker、模型和工作目录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Readiness'
  schemas:
    Submission:
      type: object
      required:
        - request_id
        - project_id
        - operation
        - status
        - created_at
      properties:
        request_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        operation:
          type: string
          enum:
            - submit
            - cron
            - rerun
        status:
          type: string
          enum:
            - pending
            - accepted
        run_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
    Schedule:
      type: object
      required:
        - id
        - name
        - expression
        - workflow
        - revision
        - paused
        - deleted
        - ready
        - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        expression:
          type: string
        workflow:
          $ref: '#/components/schemas/Workflow'
        revision:
          type: integer
          minimum: 1
        paused:
          type: boolean
        deleted:
          type: boolean
        ready:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
    ScheduleFire:
      type: object
      required:
        - schedule_id
        - slot
        - status
        - reason
      properties:
        schedule_id:
          type: string
          format: uuid
        slot:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - pending
            - accepted
            - skipped
        reason:
          type: string
        request_id:
          type: string
          format: uuid
    ProjectRegistration:
      type: object
      additionalProperties: false
      required:
        - name
        - source
        - branch
        - worker_id
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        source:
          type: string
          description: 绑定 Worker 上的本地 Git 项目绝对路径
        branch:
          type: string
          description: 本地分支，不自动 fetch
        worker_id:
          type: string
        verification:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 1024
          description: 管理员登记的验证命令参数数组，首项为Worker上的绝对程序路径；每个Codex节点成功后、检查点发布前执行，最长30秒。禁止凭据参数。不配置时为空数组。
    Project:
      type: object
      required:
        - id
        - name
        - source
        - branch
        - worker_id
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        source:
          type: string
        branch:
          type: string
        worker_id:
          type: string
        verification:
          type: array
          maxItems: 32
          items:
            type: string
            maxLength: 1024
          description: 管理员登记的验证命令参数数组，首项为Worker上的绝对程序路径；每个Codex节点成功后、检查点发布前执行，最长30秒。禁止凭据参数。不配置时为空数组。
    Preflight:
      type: object
      required:
        - ready
        - checks
      properties:
        ready:
          type: boolean
        checks:
          type: array
          items:
            type: object
            required:
              - component
              - status
            properties:
              component:
                type: string
              status:
                type: string
                enum:
                  - ready
                  - configured
                  - unavailable
    ArtifactFile:
      type: object
      required:
        - id
        - path
        - change
        - size
        - binary
      properties:
        id:
          type: string
          description: Git 文件为 32 位十六进制摘要；产品经理报告为 UUID。
        path:
          type: string
          description: 仓库相对路径，不是本机绝对路径
        change:
          type: string
          enum:
            - A
            - M
            - D
            - T
        size:
          type: integer
          format: int64
          minimum: 0
        sha256:
          type: string
        binary:
          type: boolean
        blocked:
          type: string
          enum:
            - sensitive
            - symlink
            - unsafe_path
            - too_large
    ArtifactManifest:
      type: object
      required:
        - run_id
        - base_commit
        - head_commit
        - files
        - total_bytes
      properties:
        run_id:
          type: string
          format: uuid
        base_commit:
          type: string
        head_commit:
          type: string
        files:
          type: array
          maxItems: 1000
          items:
            $ref: '#/components/schemas/ArtifactFile'
        total_bytes:
          type: integer
          format: int64
    AttemptPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          maxItems: 100
          items:
            $ref: '#/components/schemas/Attempt'
        next_offset:
          type: integer
          minimum: 0
    Attempt:
      type: object
      required:
        - run_id
        - node_run_id
        - node_id
        - attempt
        - started_at
        - status
        - message
        - truncated
        - evidence
        - evidence_truncated
        - category
      properties:
        run_id:
          type: string
          format: uuid
        node_run_id:
          type: string
          format: uuid
        node_id:
          type: string
        attempt:
          type: integer
          minimum: 1
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - running
            - succeeded
            - failed
            - cancelled
        message:
          type: string
        truncated:
          type: boolean
        evidence_truncated:
          type: boolean
        evidence:
          type: array
          items:
            type: object
            required:
              - id
              - command
              - exit_code
              - output
              - truncated
            properties:
              id:
                type: string
              command:
                type: string
              exit_code:
                type: integer
              output:
                type: string
              truncated:
                type: boolean
        category:
          type: string
    RunSummary:
      type: object
      required:
        - id
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
            - queued
            - running
            - cancelling
            - succeeded
            - failed
            - cancelled
            - unknown
        created_at:
          type: string
          format: date-time
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        created_by:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
    RunError:
      type: object
      required:
        - category
        - message
        - truncated
      properties:
        category:
          type: string
        message:
          type: string
          description: 已脱敏的诊断，最多64KiB
        truncated:
          type: boolean
    NodeRun:
      allOf:
        - $ref: '#/components/schemas/RunSummary'
        - type: object
          required:
            - node_id
            - task_id
            - executor
            - attempt
          properties:
            node_id:
              type: string
            task_id:
              type: string
              format: uuid
            executor:
              type: string
            attempt:
              type: integer
              minimum: 1
            output:
              type: string
            error:
              $ref: '#/components/schemas/RunError'
    RunEvent:
      type: object
      required:
        - id
        - task_id
        - attempt
        - type
        - time
        - message
        - truncated
      properties:
        id:
          type: integer
        task_id:
          type: string
          format: uuid
        attempt:
          type: integer
          minimum: 1
        type:
          type: string
        time:
          type: string
          format: date-time
        message:
          type: string
        truncated:
          type: boolean
    RunDetails:
      allOf:
        - $ref: '#/components/schemas/RunSummary'
        - type: object
          required:
            - nodes
            - events
            - attempts
            - cancel_requested
            - stop_confirmed
            - logs_expired
          properties:
            nodes:
              type: array
              items:
                $ref: '#/components/schemas/NodeRun'
            events:
              type: array
              items:
                $ref: '#/components/schemas/RunEvent'
            attempts:
              type: array
              items:
                $ref: '#/components/schemas/Attempt'
            attempts_next_offset:
              type: integer
              minimum: 0
            cancel_requested:
              type: boolean
            stop_confirmed:
              type: boolean
              description: 根/子任务终态且没有未确认停止的执行尝试
            error:
              $ref: '#/components/schemas/RunError'
            definition:
              $ref: '#/components/schemas/Workflow'
            source_run_id:
              type: string
              format: uuid
            logs_expired:
              type: boolean
              description: 日志、产物与重跑基准已到期。
    RunList:
      type: object
      required:
        - items
        - since
        - until
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RunSummary'
        next_offset:
          type: integer
          minimum: 0
        since:
          type: string
          format: date-time
        until:
          type: string
          format: date-time
    Health:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    Readiness:
      type: object
      required:
        - status
        - scope
        - checks
      properties:
        status:
          type: string
          enum:
            - ready
            - not_ready
        scope:
          type: string
          enum:
            - api_dependencies
        checks:
          type: object
          required:
            - database
            - hatchet_registration
          properties:
            database:
              type: string
              enum:
                - ok
                - unavailable
            hatchet_registration:
              type: string
              enum:
                - ok
                - unavailable
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    Validation:
      type: object
      required:
        - valid
        - layers
      properties:
        valid:
          type: boolean
          enum:
            - true
        layers:
          type: array
          items:
            type: array
            items:
              type: string
    Workflow:
      type: object
      additionalProperties: false
      required:
        - nodes
      properties:
        project_id:
          type: string
          format: uuid
          description: Codex 编排必填；必须为当前命名空间登记的项目
        input:
          type: string
        nodes:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/Node'
        version_id:
          type: string
          format: uuid
        input_schema:
          $ref: '#/components/schemas/Shape'
    Node:
      type: object
      additionalProperties: false
      required:
        - id
        - executor
        - instruction
      properties:
        id:
          type: string
          pattern: ^[a-zA-Z][a-zA-Z0-9_-]{0,63}$
        executor:
          type: string
          enum:
            - eino
            - codex
        instruction:
          type: string
          pattern: \S
          description: 非空，最多 16 KiB
        description:
          type: string
          description: 最多 1 KiB
        model:
          type: string
          description: Eino 必填；提供时非空且最多 128 字节
        depends_on:
          type: array
          uniqueItems: true
          items:
            type: string
        agent_version:
          type: string
          format: uuid
        connection_version:
          type: string
          format: uuid
        output_schema:
          $ref: '#/components/schemas/Shape'
        bindings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldBinding'
        policy:
          $ref: '#/components/schemas/Policy'
        role:
          type: string
          enum:
            - product_manager
        mode:
          type: string
          enum:
            - research
            - competition
            - planning
            - design
        read_only:
          type: boolean
          description: 仅 Codex：设置原生 read-only 沙箱；写入变更不能发布检查点。
      oneOf:
        - required:
            - model
          properties:
            executor:
              type: string
              enum:
                - eino
            model:
              type: string
              pattern: \S
        - properties:
            executor:
              type: string
              enum:
                - codex
    Shape:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - object
            - array
            - string
            - number
            - integer
            - boolean
            - 'null'
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Shape'
        required:
          type: array
          items:
            type: string
        items:
          $ref: '#/components/schemas/Shape'
      required:
        - type
      description: 无引用与脚本的 JSON Schema 子集；对象拒绝未知字段，最多 6 层、每层 64 个字段、整体 16 KiB。
    FieldBinding:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
        pointer:
          type: string
        type:
          type: string
      required:
        - from
        - pointer
        - type
      description: 只读取 $input 或声明的直接上游；pointer 为 JSON Pointer，无隐式类型转换。
    Connection:
      type: object
      additionalProperties: false
      properties:
        base_url:
          type: string
          format: uri
        model:
          type: string
        secret_ref:
          type: string
          pattern: ^PANGU_SECRET_[A-Z][A-Z0-9_]{0,63}$
      required:
        - base_url
        - model
        - secret_ref
      description: 仅保存服务端凭据变量名；版本/API 不包含密钥，执行时读取原始来源。
    FlowBinding:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        agent_version:
          type: string
          format: uuid
        depends_on:
          type: array
          items:
            type: string
        bindings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldBinding'
      required:
        - id
        - agent_version
    Flow:
      type: object
      additionalProperties: false
      properties:
        parameters:
          $ref: '#/components/schemas/Shape'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/FlowBinding'
      required:
        - nodes
    CatalogSpec:
      type: object
      additionalProperties: false
      properties:
        agent:
          $ref: '#/components/schemas/Node'
        template_version:
          type: string
          format: uuid
        flow:
          $ref: '#/components/schemas/Flow'
        connection:
          $ref: '#/components/schemas/Connection'
      required: []
    CatalogCreate:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - template
            - agent
            - workflow
            - connection
        project_id:
          type: string
          format: uuid
        name:
          type: string
        spec:
          $ref: '#/components/schemas/CatalogSpec'
      required:
        - kind
        - name
        - spec
    CatalogObject:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - template
            - agent
            - workflow
            - connection
        project_id:
          type: string
          format: uuid
        name:
          type: string
        spec:
          $ref: '#/components/schemas/CatalogSpec'
        id:
          type: string
          format: uuid
        revision:
          type: integer
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
      required:
        - id
        - kind
        - name
        - spec
        - revision
        - archived
        - created_at
    CatalogVersion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        object_id:
          type: string
          format: uuid
        kind:
          type: string
        project_id:
          type: string
          format: uuid
        number:
          type: integer
        source_revision:
          type: integer
        spec:
          $ref: '#/components/schemas/CatalogSpec'
        created_at:
          type: string
          format: date-time
        archived:
          type: boolean
      required:
        - id
        - object_id
        - kind
        - number
        - source_revision
        - spec
        - created_at
        - archived
    Policy:
      type: object
      additionalProperties: false
      properties:
        retries:
          type: integer
          minimum: 0
          maximum: 2
        timeout_seconds:
          type: integer
          minimum: 1
          maximum: 1800
        tool_calls:
          type: integer
          minimum: 0
          maximum: 10
      required:
        - retries
        - timeout_seconds
        - tool_calls
      description: Eino 超时上限 180 秒，Codex 1800 秒；工具上限由 Eino 受控工具执行，原生 Codex 工具次数边界仍在验证。缺省重试 2 次，工具 10 次。
    CatalogDocument:
      type: object
      additionalProperties: false
      properties:
        format:
          type: string
          enum:
            - pangu.catalog.v1
        kind:
          type: string
          enum:
            - template
            - agent
            - workflow
            - connection
        project_id:
          type: string
          format: uuid
        name:
          type: string
        spec:
          $ref: '#/components/schemas/CatalogSpec'
      required:
        - format
        - kind
        - name
        - spec
    ResearchBrief:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
        audience:
          type: string
        market:
          type: string
        time_scope:
          type: string
        context:
          type: string
        constraints:
          type: string
        public_queries:
          type: array
          items:
            type: string
        urls:
          type: array
          items:
            type: string
        documents:
          type: array
          items:
            type: string
        competitors:
          type: array
          items:
