          properties:
            database:
              type: string
              enum:
                - ok
                - unavailable
            hatchet_registration:
              type: string
              enum:
                - ok
                - unavailable
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    Validation:
      type: object
      required:
        - valid
        - layers
      properties:
        valid:
          type: boolean
          enum:
            - true
        layers:
          type: array
          items:
            type: array
            items:
              type: string
    Workflow:
      type: object
      additionalProperties: false
      required:
        - nodes
      properties:
        loops: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/Loop'}}
        budget: {$ref: '#/components/schemas/Budget'}
        project_id:
          type: string
          format: uuid
          description: Codex 编排必填；必须为当前命名空间登记的项目
        input:
          type: string
        nodes:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/Node'
        version_id:
          type: string
          format: uuid
        input_schema:
          $ref: '#/components/schemas/Shape'
    Loop:
      type: object
      additionalProperties: false
      required: [id, nodes, gates]
      description: 平台控制的循环块，块内无环、不重叠、不嵌套；质量门全部通过后才离开，不设轮数上限。
      properties:
        id: {type: string, pattern: '^[a-zA-Z][a-zA-Z0-9_-]{0,63}$'}
        nodes: {type: array, minItems: 2, maxItems: 32, uniqueItems: true, items: {type: string}}
        gates: {type: array, minItems: 1, maxItems: 32, uniqueItems: true, items: {type: string}, description: 依次执行的只读质量门，输出必填 passed 布尔值与 summary 文本}
    Iteration:
      type: object
      required: [id, round]
      properties:
        id: {type: string}
        round: {type: integer, minimum: 1}
        gate: {type: boolean}
        feedback:
          type: object
          required: [round, node_id, node_run_id, summary]
          properties:
            round: {type: integer, minimum: 1}
            node_id: {type: string}
            node_run_id: {type: string}
            summary: {type: string}
            report_ids: {type: array, items: {type: string}}
    ReasoningEffort:
      type: string
      enum: [none, minimal, low, medium, high, xhigh, max, ultra]
    Node:
      type: object
      additionalProperties: false
      required:
        - id
        - executor
        - instruction
      properties:
        handoff:
          $ref: '#/components/schemas/HandoffContract'
        when: {$ref: '#/components/schemas/Condition'}
        approval: {$ref: '#/components/schemas/ApprovalPolicy'}
        id:
          type: string
          pattern: ^[a-zA-Z][a-zA-Z0-9_-]{0,63}$
        executor:
          type: string
          enum:
            - eino
            - codex
        instruction:
          type: string
          pattern: \S
          description: 非空，最多 16 KiB
        description:
          type: string
          description: 最多 1 KiB
        model:
          type: string
          pattern: ^$|\S
          maxLength: 128
          description: 无模型连接的 Eino 必填；有连接时须与连接模型一致，Codex 账号连接可留空使用默认模型。
        reasoning_effort: {$ref: '#/components/schemas/ReasoningEffort'}
        fast:
          type: boolean
          description: Codex Fast 模式；省略沿用运行环境，false 显式使用普通档位。自定义运行选项必须选择具体模型。
        depends_on:
          type: array
          uniqueItems: true
          items:
            type: string
        agent_version:
          type: string
          format: uuid
        connection_version:
          type: string
          format: uuid
        output_schema:
          $ref: '#/components/schemas/Shape'
        report_schema:
          $ref: '#/components/schemas/Shape'
        bindings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldBinding'
        policy:
          $ref: '#/components/schemas/Policy'
        role:
          type: string
          enum:
            - product_manager
        mode:
          type: string
          enum:
            - research
            - competition
            - planning
            - design
        read_only:
          type: boolean
          description: 仅 Codex：设置原生 read-only 沙箱；写入变更不能发布检查点。
      oneOf:
        - properties:
            executor:
              type: string
              enum:
                - eino
          anyOf:
            - required: [connection_version]
            - required: [model]
              properties:
                model: {type: string, pattern: '\S'}
        - properties:
            executor:
              type: string
              enum:
                - codex
    HandoffContract:
      type: object
      additionalProperties: false
      description: 交接契约。草稿允许缺项或留空；发布、试运行及新任务提交时五项均须为非空白文本，每项最多 4096 UTF-8 字节。状态、权限和预算由既有运行配置控制，契约描述不授予额外权限。
      properties:
        objective: {type: string, maxLength: 4096, description: 任务目标与职责边界}
        inputs: {type: string, maxLength: 4096, description: 必需输入与上下文}
        deliverables: {type: string, maxLength: 4096, description: 交付物及其格式}
        acceptance: {type: string, maxLength: 4096, description: 可核验的验收标准}
        failure_handling: {type: string, maxLength: 4096, description: 缺失资料与失败时如何处理}
    Shape:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - object
            - array
            - string
            - number
            - integer
            - boolean
            - 'null'
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Shape'
        required:
          type: array
          items:
            type: string
        items:
          $ref: '#/components/schemas/Shape'
      required:
        - type
      description: 无引用与脚本的 JSON Schema 子集；对象拒绝未知字段，最多 6 层、每层 64 个字段、整体 16 KiB。
    FieldBinding:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
        pointer:
          type: string
        type:
          type: string
      required:
        - from
        - pointer
        - type
      description: 只读取 $input 或声明的直接上游；pointer 为 JSON Pointer，无隐式类型转换。
    Connection:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          enum: [openai, codex]
        price: {$ref: '#/components/schemas/Price'}
        base_url:
          type: string
          format: uri
        model:
          type: string
          maxLength: 128
        secret_ref:
          type: string
          pattern: ^PANGU_SECRET_[A-Z][A-Z0-9_]{0,63}$
      oneOf:
        - properties:
            provider: {enum: [openai]}
            model: {minLength: 1}
          required: [base_url, model, secret_ref]
        - properties:
            provider: {enum: [codex]}
          required: [provider]
          not:
            anyOf:
              - required: [base_url]
              - required: [secret_ref]
              - required: [price]
      description: openai 使用服务端凭据引用；codex 使用 Worker 专用登录且模型可留空，禁止配置 API 端点、凭据引用与单价。执行时读取原始来源，不返回密钥。
    FlowBinding:
      type: object
      additionalProperties: false
      properties:
        task: {type: string, description: 本步骤任务，追加到角色指令；最多 8192 字节，合并后指令最多 16384 字节}
        read_only: {type: boolean, description: 仅可收紧为只读，不能解除助手已有的只读权限}
        output_schema: {$ref: '#/components/schemas/Shape'}
        report_schema: {$ref: '#/components/schemas/Shape'}
        when: {$ref: '#/components/schemas/Condition'}
        approval: {$ref: '#/components/schemas/ApprovalPolicy'}
        id:
          type: string
        agent_version:
          type: string
          format: uuid
        depends_on:
          type: array
          items:
            type: string
        bindings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldBinding'
      required:
        - id
        - agent_version
    ExecutionPlanPreview:
      type: object
      required: [base_version, object_id, revision, flow, workflow, changes, assignments]
      properties:
        base_version: {type: string, format: uuid}
        object_id: {type: string, format: uuid}
        revision: {type: integer}
        flow: {$ref: '#/components/schemas/Flow'}
        workflow: {$ref: '#/components/schemas/Workflow'}
        changes:
          type: array
          items:
            type: object
            required: [node_id]
            properties:
              node_id: {type: string}
              before: {$ref: '#/components/schemas/FlowBinding'}
              after: {$ref: '#/components/schemas/FlowBinding'}
        assignments:
          type: array
          items:
            type: object
            required: [task_id, node_id]
            properties:
              task_id: {type: string}
              node_id: {type: string}
    FlowEditor:
      type: object
      additionalProperties: false
      properties:
        nodes:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            properties:
              name: {type: string, description: 节点显示名称，最多 128 字节}
              x: {type: number, minimum: -1000000, maximum: 1000000}
              y: {type: number, minimum: -1000000, maximum: 1000000}
            required: [x, y]
        viewport:
          type: object
          additionalProperties: false
          properties:
            x: {type: number, minimum: -1000000, maximum: 1000000}
            y: {type: number, minimum: -1000000, maximum: 1000000}
            zoom: {type: number, minimum: 0.1, maximum: 2}
          required: [x, y, zoom]
      description: 仅用于画布展示，与草稿及发布版本一起保存，执行编译忽略。
    Flow:
      type: object
      additionalProperties: false
      properties:
        loops: {type: array, maxItems: 16, items: {$ref: '#/components/schemas/Loop'}}
        editor: {$ref: '#/components/schemas/FlowEditor'}
        budget: {$ref: '#/components/schemas/Budget'}
        parameters:
          $ref: '#/components/schemas/Shape'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/FlowBinding'
      required:
        - nodes
    CatalogSpec:
      type: object
      additionalProperties: false
      properties:
        agent:
          $ref: '#/components/schemas/Node'
        flow:
          $ref: '#/components/schemas/Flow'
        connection:
          $ref: '#/components/schemas/Connection'
      required: []
    CatalogCreate:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - agent
            - workflow
            - connection
        name:
          type: string
        spec:
          $ref: '#/components/schemas/CatalogSpec'
      required:
        - kind
        - name
        - spec
    CatalogObject:
      type: object
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - agent
            - workflow
            - connection
        name:
          type: string
        spec:
          $ref: '#/components/schemas/CatalogSpec'
        id:
          type: string
          format: uuid
        revision:
          type: integer
        archived:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: 最近保存、首次发布该修订或归档状态变更的时间。
      required:
        - id
        - kind
        - name
        - spec
        - revision
        - archived
        - created_at
        - updated_at
    CatalogVersion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        object_id:
          type: string
          format: uuid
        kind:
          type: string
        number:
          type: integer
        source_revision:
          type: integer
        spec:
          $ref: '#/components/schemas/CatalogSpec'
        created_at:
          type: string
          format: date-time
        archived:
          type: boolean
      required:
        - id
        - object_id
        - kind
        - number
        - source_revision
        - spec
        - created_at
        - archived
    Policy:
      type: object
      additionalProperties: false
      properties:
        retries: {type: integer, minimum: 0, maximum: 2}
      required: [retries]
      description: 只控制失败重试，缺省 2 次；不设置工具次数或执行时限。
    CatalogDocument:
      type: object
      additionalProperties: false
      properties:
        format:
          type: string
          enum:
            - pangu.catalog.v1
        kind:
          type: string
          enum:
            - agent
            - workflow
            - connection
        name:
          type: string
        spec:
          $ref: '#/components/schemas/CatalogSpec'
      required:
        - format
        - kind
        - name
        - spec
    ResearchBrief:
      type: object
      additionalProperties: false
      properties:
        question:
          type: string
        audience:
          type: string
        market:
          type: string
        time_scope:
          type: string
        context:
          type: string
        constraints:
          type: string
        public_queries:
          type: array
          items:
            type: string
        urls:
          type: array
          items:
            type: string
        documents:
          type: array
          items:
            type: string
        competitors:
          type: array
          items:
            type: string
        dimensions:
          type: array
          items:
            type: string
      required:
        - question
      description: 产品经理 input 使用此结构的 JSON 字符串；只有任务目标必填，省略背景表示未提供，不推测用户资料。各列表最多 10 项。竞品模式要求 competitors/dimensions，调研要求至少一个授权资料来源。
    Actor:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        admin:
          type: boolean
        csrf:
          type: string
      required:
        - id
        - name
        - admin
    Membership:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
          format: uuid
        role:
          type: string
          enum:
            - manager
            - operator
            - viewer
      required:
        - project_id
        - role
    Member:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        open_id:
          type: string
        name:
          type: string
        role:
          type: string
          enum:
            - manager
            - operator
            - viewer
        enabled:
          type: boolean
        disabled:
          type: boolean
      required:
        - id
        - open_id
        - name
        - role
        - enabled
        - disabled
    APIToken:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project_id:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
            enum:
              - read
              - run
              - configure
              - schedule
              - manage_run
              - manage_schedule
              - manage_factory
              - manage_connections
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
      required:
        - id
        - name
        - project_id
        - scopes
        - expires_at
    TokenIssue:
      type: object
      additionalProperties: false
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
            enum:
              - read
              - run
              - configure
              - schedule
              - manage_run
              - manage_schedule
              - manage_factory
              - manage_connections
        expires_at:
          type: string
          format: date-time
      required:
        - project_id
        - name
        - scopes
        - expires_at
    TokenIssued:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        project_id:
          type: string
          format: uuid
        scopes:
          type: array
          items:
            type: string
            enum:
              - read
              - run
              - configure
              - schedule
              - manage_run
              - manage_schedule
              - manage_factory
              - manage_connections
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
        value:
          type: string
          description: 仅此响应返回一次；服务端仅保存摘要。
      required:
        - id
        - name
        - project_id
        - scopes
        - expires_at
        - value
    CatalogPage:
      type: object
      additionalProperties: false
