openapi: 3.0.3
info:
  title: Pangu 本地 API
  version: 0.1.0
  description: Pangu Agent 工厂 API。业务接口使用飞书会话或项目 API Token；GitHub 接收入口独立验证 HMAC 签名。人工审批、采纳和证据核验要求飞书会话。配置权限与会话每次查询原始数据库。
servers:
  - url: /api
paths:
  /projects/{id}/experience-policy:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: getExperiencePolicy
      responses:
        '200': {description: 默认关闭或当前项目策略, content: {application/json: {schema: {$ref: '#/components/schemas/ExperiencePolicy'}}}}
        '403': {$ref: '#/components/responses/Error'}
    put:
      operationId: saveExperiencePolicy
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExperiencePolicyUpdate'}}}}
      responses:
        '200': {description: 原库 CAS 保存后的新修订, content: {application/json: {schema: {$ref: '#/components/schemas/ExperiencePolicy'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{id}/experience-capabilities:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: getExperienceCapabilities
      responses:
        '200': {description: 实时权限及已接通能力；缺省项不得视为授权, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceCapabilities'}}}}
        '403': {$ref: '#/components/responses/Error'}
  /projects/{id}/experiences:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/ExperienceCursor'}
      - {$ref: '#/components/parameters/ExperienceLimit'}
    get:
      operationId: listExperiences
      responses:
        '200': {description: 同事务重新检查来源授权后的元数据页, content: {application/json: {schema: {$ref: '#/components/schemas/ExperiencePage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
  /projects/{id}/experiences/{version}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/ExperienceVersionID'}
    get:
      operationId: getExperience
      responses:
        '200': {description: 读取原证据重新授权后的经验；非保护或保留集内容, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceVersion'}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
    delete:
      operationId: deleteExperience
      description: 不可逆撤销并清正文，保留审计墓碑；不得复活同一版本。
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceReason'}}}}
      responses:
        '204': {description: 已撤销并清正文}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{id}/experiences/{version}/usages:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/ExperienceVersionID'}
      - {$ref: '#/components/parameters/ExperienceCursor'}
      - {$ref: '#/components/parameters/ExperienceLimit'}
    get:
      operationId: listExperienceUsages
      responses:
        '200': {description: 使用关系摘要；检索或引用不等于成功归因，不返回检索文本及原始注入, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceUsagePage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{id}/experiences/{version}/revoke:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/ExperienceVersionID'}
    post:
      operationId: revokeExperience
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceReason'}}}}
      responses:
        '204': {description: 已幂等撤销；旧来源与传递成果不得继续复用}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{id}/experiences/{version}/activate:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/ExperienceVersionID'}
    post:
      operationId: verifyExperienceClaim
      description: 执行预注册检查器并在激活事务里形成机器回执，禁止传入 Passed 或 receipt。验证正确不等于投放有收益。
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceClaimRequest'}}}}
      responses:
        '200': {description: 经真实检查激活为 shadow, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceVersion'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
  /projects/{id}/experiences/{version}/delivery:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/ExperienceVersionID'}
    post:
      operationId: changeExperienceDelivery
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceDeliveryRequest'}}}}
      responses:
        '200': {description: 服务端独立收益核验后的投放状态, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceVersion'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /projects/{id}/experience-sources:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    post:
      operationId: grantExperienceSource
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceSourceGrant'}}}}
      responses:
        '204': {description: 针对原始真实证据的有限保留授权；已曝光历史不可洗白为隐藏集}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{id}/experience-sources/{source}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: source, in: path, required: true, schema: {type: string, format: uuid}}
    delete:
      operationId: withdrawExperienceSource
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      responses:
        '204': {description: 撤销来源保留授权，不抹除已曝光历史}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /projects/{id}/experience-checkers:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: listExperienceCheckers
      parameters:
        - {$ref: '#/components/parameters/ExperienceCursor'}
        - {$ref: '#/components/parameters/ExperienceLimit'}
      responses:
        '200': {description: 检查器元数据，不返回 expected 或可作答案探测的内容哈希, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceCheckerPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: registerExperienceChecker
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceCheckerRegistration'}}}}
      responses:
        '201': {description: 预注册窄范围事实检查器，不可用于已有候选的事后验收, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceChecker'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /projects/{id}/evolution/intents:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/ExperienceCursor'}
      - {$ref: '#/components/parameters/ExperienceLimit'}
    get:
      operationId: listEvolutionIntents
      responses:
        '200': {description: 管理员只读历史；策略停用或未接执行器不隐藏历史, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionIntentPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: startEvolutionCandidate
      description: 仅提交 Instruction 候选；角色、项目、当前配置和机器证据均由服务端重建。202 不是评测通过。
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionCandidateRequest'}}}}
      responses:
        '202': {description: 持久接收独立实验, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionIntentSummary'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /projects/{id}/evolution/intents/{intent}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/EvolutionIntentID'}
    get:
      operationId: getEvolutionIntent
      responses:
        '200': {description: 安全的代际与发布状态；不暴露隐藏套件、机器结果或逐例反馈, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionIntentSummary'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{id}/evolution/intents/{intent}/decision:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/EvolutionIntentID'}
    post:
      operationId: decideEvolutionIntent
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionGeneration'}}}}
      responses:
        '200': {description: 重读真实机器证据后的最小判定摘要，无逐例反馈或区间, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionDecision'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /projects/{id}/evolution/intents/{intent}/promote:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/EvolutionIntentID'}
    post:
      operationId: promoteEvolutionIntent
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionGeneration'}}}}
      responses:
        '202': {description: 持久发布状态，不代表入口已完成远端切换, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionIntentSummary'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /projects/{id}/evolution/intents/{intent}/observe:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/EvolutionIntentID'}
    post:
      operationId: observeEvolutionIntent
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionObservationRequest'}}}}
      responses:
        '202': {description: 从实际业务运行重读的观察状态，不接收分数或通过标志, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionIntentSummary'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /runs/{id}/experience:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: usage_cursor, in: query, schema: {type: string}}
      - {name: artifact_cursor, in: query, schema: {type: string}}
      - {$ref: '#/components/parameters/ExperienceLimit'}
    get:
      operationId: runExperienceLineage
      responses:
        '200': {description: 由真实运行与请求绑定推导的经验水位及分页依赖摘要；旧任务缺水位标记 unproven, content: {application/json: {schema: {$ref: '#/components/schemas/RunExperienceLineage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /projects/{id}/experiences/{version}/observe:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/ExperienceVersionID'}
    post:
      operationId: observeExperienceMemory
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceObservationRequest'}}}}
      responses:
        '201': {description: 原始业务反馈和真实投放使用记录派生的观察；不接受调用方结果, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceObservation'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /projects/{id}/experience-artifacts/{artifact}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: artifact, in: path, required: true, schema: {type: string, maxLength: 256}}
    get:
      operationId: experienceArtifactSummary
      responses:
        '200': {description: 显式展开同项目父依赖；不返回成果正文；来源受限返回 redacted 摘要, content: {application/json: {schema: {$ref: '#/components/schemas/ExperienceArtifactSummary'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /runs/{id}/rebuild-intents:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: listApprovalRebuildIntents
      responses:
        '200': {description: 失效代际和独立后继请求，不恢复旧审批, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ApprovalRebuildIntent'}}}}}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /runs/{id}/rebuild-intents/{intent}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/EvolutionIntentID'}
    post:
      operationId: rebuildInvalidatedRun
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {type: object, additionalProperties: false}}}}
      responses:
        '202': {description: 原创建人获准的幂等后继请求, content: {application/json: {schema: {$ref: '#/components/schemas/Submission'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /projects/{id}/evolution/intents/{intent}/rollback:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/EvolutionIntentID'}
    post:
      operationId: rollbackEvolutionIntent
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionRollback'}}}}
      responses:
        '202': {description: 已接收回退意图；不代表远端已完成，不撤销既有外部副作用, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionIntentSummary'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /projects/{id}/evolution/environments:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: listEvolutionEnvironments
      parameters:
        - {$ref: '#/components/parameters/ExperienceCursor'}
        - {$ref: '#/components/parameters/ExperienceLimit'}
      responses:
        '200': {description: 项目内最新环境修订，含停用环境, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionEnvironmentPage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: registerEvolutionEnvironment
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionEnvironmentUpdate'}}}}
      responses:
        '201': {description: CAS 注册真实无工具受控环境；哈希与源基线由服务端计算, content: {application/json: {schema: {$ref: '#/components/schemas/EvolutionEnvironment'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /projects/{id}/entries/{entry}/runs:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: entry, in: path, required: true, description: 工作台入口裸ID，服务端固定workbench种类, schema: {type: string, minLength: 1, maxLength: 256}}
    post:
      operationId: submitWorkbenchEntry
      parameters:
        - {$ref: '#/components/parameters/ExperienceCSRF'}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/WorkbenchEntrySubmission'}}}}
      responses:
        '202': {description: 真实入口绑定已核验并产生持久业务请求；pending不代表执行完成, content: {application/json: {schema: {$ref: '#/components/schemas/Submission'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
  /projects/{id}/runnables:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: offset, in: query, schema: {type: integer, minimum: 0}}
    get:
      operationId: projectRunnableChoices
      responses:
        '200': {description: 共享手工发布及本项目稳定自动版本；不返回 observing 或墓碑, content: {application/json: {schema: {$ref: '#/components/schemas/RunnableChoicePage'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /projects/{id}/versions/{version}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {$ref: '#/components/parameters/ExperienceVersionID'}
    get:
      operationId: projectCatalogVersion
      responses:
        '200': {description: 重新检查项目范围和版本可用性, content: {application/json: {schema: {$ref: '#/components/schemas/CatalogVersion'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /projects/{id}/catalog/{object}/versions:
    parameters:
      - {$ref: '#/components/parameters/ID'}
      - {name: object, in: path, required: true, schema: {type: string, format: uuid}}
      - {name: offset, in: query, schema: {type: integer, minimum: 0}}
    get:
      operationId: projectCatalogVersions
      responses:
        '200': {description: 项目可用版本，每页100条，按版本号倒序, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/CatalogVersion'}}}}}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /factory/sessions:
    get:
      operationId: listFactorySessions
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200':
          description: 当前项目的工厂对话
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactorySessionPage'}
        '403': {$ref: '#/components/responses/Error'}
    post:
      operationId: createFactorySession
      parameters:
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [project_id]
              properties:
                project_id: {type: string, format: uuid}
      responses:
        '201':
          description: 已创建空对话，不调用模型
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactorySession'}
        '403': {$ref: '#/components/responses/Error'}
  /factory/sessions/{id}:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: getFactorySession
      responses:
        '200':
          description: 对话、候选与创建回执；同步已完成生成结果
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FactorySession'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /factory/sessions/{id}/messages:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    post:
      operationId: generateFactoryProposal
      parameters:
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FactoryInput'}
      responses:
        '202':
          description: 单次受限生成任务已保存，消息 ID 用于幂等重试
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Submission'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '503': {$ref: '#/components/responses/Error'}
