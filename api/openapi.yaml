  /runs/{id}/activity:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: runActivity
      description: 每个活动节点最近开始且尚未结束的操作。仅包含未结束的实际尝试，按节点返回至多一条；不受 trace 分页影响，并行操作的全部记录可按节点查询 trace。复用运行读取权限及正文保留期。
      responses:
        '200':
          description: 脱敏后的当前操作，没有活动时为空数组
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/TraceEvent'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /runs/{id}/trace:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: runTrace
      description: 分页读取实际行为，每条事件关联运行、节点、尝试及父 span；正文在写入前脱敏和截断，不记录内部思维链。
      parameters:
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: before, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: node, in: query, schema: {type: string, maxLength: 128}}
        - {name: kind, in: query, schema: {type: string, enum: [node, model, tool]}}
        - {name: status, in: query, schema: {type: string, enum: [running, succeeded, failed, cancelled]}}
      responses:
        '200':
          description: 脱敏后的追踪事件
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TracePage'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /runs/{id}/trace.ndjson:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: exportTrace
      description: 导出当前筛选下的全部追踪事件，按序号倒序；开始后新增事件不纳入。文件末尾 export_error 表示导出中断。
      parameters:
        - {name: after, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: before, in: query, schema: {type: integer, format: int64, minimum: 0}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
        - {name: node, in: query, schema: {type: string, maxLength: 128}}
        - {name: kind, in: query, schema: {type: string, enum: [node, model, tool]}}
        - {name: status, in: query, schema: {type: string, enum: [running, succeeded, failed, cancelled]}}
      responses:
        '200':
          description: 脱敏后的追踪事件
          content:
            application/x-ndjson:
              schema: {type: string}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
  /runs/{id}/debug:
    parameters:
      - {$ref: '#/components/parameters/ID'}
    get:
      operationId: runDebug
      responses:
        '200':
          description: 持久调试状态和活动节点数
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DebugState'}
        '403': {$ref: '#/components/responses/Error'}
        '410': {$ref: '#/components/responses/Error'}
    post:
      operationId: controlDebug
      description: 需要 manage_run 权限；暂停阻止后续节点开始，已执行的节点继续。单步放行一个节点尝试（失败重试也重新等待许可）。状态版本不符或仍有活动节点时返回 409。
      parameters:
        - {name: X-CSRF-Token, in: header, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, revision]
              properties:
                action: {type: string, enum: [pause, resume, step]}
                revision: {type: integer, minimum: 0}
      responses:
        '200':
          description: 操作后的调试状态
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DebugState'}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
        '502': {$ref: '#/components/responses/Error'}
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,128}$
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  requestBodies:
    Workflow:
      required: true
      description: 请求体最多 256 KiB；字节限制和依赖完整性由服务端校验
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Workflow'
  responses:
    Preflight:
      description: 在实际 Worker 检查环境；Eino configured 不代表凭据或模型可用，未发送收费请求
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/Preflight'
              - $ref: '#/components/schemas/Error'
    Error:
      description: 请求或服务错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Readiness:
      description: 产品数据库连接/迁移与 Hatchet 编排注册；不检查在线 Worker、模型和工作目录
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Readiness'
  schemas:
    DebugState:
      type: object
      required: [paused, step_requested, step_node, revision, active]
      properties:
        paused: {type: boolean}
        step_requested: {type: boolean}
        step_node: {type: string}
        revision: {type: integer}
        active: {type: integer}
    TracePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TraceEvent'}
        next_before: {type: integer, format: int64}
    TraceEvent:
      type: object
      required: [id, run_id, node_id, node_run_id, attempt, span_id, parent_span_id, kind, phase, name, time, duration_ms, status, input, output, error, truncated]
      properties:
        id: {type: integer, format: int64}
        run_id: {type: string, format: uuid}
        node_id: {type: string}
        node_run_id: {type: string, format: uuid}
        attempt: {type: integer}
        span_id: {type: string}
        parent_span_id: {type: string}
        kind: {type: string, enum: [node, model, tool]}
        phase: {type: string, enum: [start, end]}
        name: {type: string}
        time: {type: string, format: date-time}
        duration_ms: {type: integer, format: int64}
        status: {type: string, enum: [running, succeeded, failed, cancelled]}
        input: {type: string}
        output: {type: string}
        error: {type: string}
        truncated: {type: boolean}
    FactoryInput:
      type: object
      additionalProperties: false
      required: [id, revision, message, mode, connection_version]
      properties:
        id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        message: {type: string, minLength: 1, maxLength: 8000}
        mode: {type: string, enum: [build, modify, diagnose, optimize]}
        connection_version: {type: string, format: uuid}
        target_id: {type: string, format: uuid}
        target_revision: {type: integer, minimum: 1}
        source_run_id: {type: string, format: uuid}
    FactoryAgent:
      type: object
      additionalProperties: false
      required: [key, name]
      properties:
        key: {type: string, pattern: '^[a-z][a-z0-9_-]{0,63}$'}
        name: {type: string}
        object_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        version_id: {type: string, format: uuid}
        node: {$ref: '#/components/schemas/Node'}
    FactoryStep:
      type: object
      additionalProperties: false
      required: [id, agent]
      properties:
        id: {type: string}
        agent: {type: string}
        depends_on: {type: array, items: {type: string}}
        bindings: {type: object, additionalProperties: {$ref: '#/components/schemas/FieldBinding'}}
        when: {$ref: '#/components/schemas/Condition'}
        approval: {$ref: '#/components/schemas/ApprovalPolicy'}
    FactoryProposal:
      type: object
      additionalProperties: false
      required: [name, agents]
      properties:
        name: {type: string}
        agents: {type: array, minItems: 1, maxItems: 12, items: {$ref: '#/components/schemas/FactoryAgent'}}
        steps: {type: array, maxItems: 32, items: {$ref: '#/components/schemas/FactoryStep'}}
        object_id: {type: string, format: uuid}
        revision: {type: integer, minimum: 1}
        parameters: {$ref: '#/components/schemas/Shape'}
        budget: {$ref: '#/components/schemas/Budget'}
    FactoryReply:
      type: object
      required: [message]
      properties:
        message: {type: string}
        proposal: {$ref: '#/components/schemas/FactoryProposal'}
    FactoryResult:
      type: object
      required: [agents]
      properties:
        agents: {type: array, items: {$ref: '#/components/schemas/CatalogVersion'}}
        workflow: {$ref: '#/components/schemas/CatalogVersion'}
    FactoryTurn:
      type: object
      required: [id, input, skill_digest, status, created_at]
      properties:
        id: {type: string, format: uuid}
        request_id: {type: string, format: uuid}
        input: {$ref: '#/components/schemas/FactoryInput'}
        skill_digest: {type: string}
        status: {type: string, enum: [pending, ready, failed, applied, expired]}
        reply: {$ref: '#/components/schemas/FactoryReply'}
        error: {type: string}
        result: {$ref: '#/components/schemas/FactoryResult'}
        created_at: {type: string, format: date-time}
    FactorySession:
      type: object
      required: [id, project_id, title, revision, updated_at, turns]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        created_by: {type: string}
        title: {type: string}
        revision: {type: integer}
        updated_at: {type: string, format: date-time}
        turns: {type: array, items: {$ref: '#/components/schemas/FactoryTurn'}}
    FactorySessionPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/FactorySession'}}
        next_offset: {type: integer}
    Condition:
      type: object
      additionalProperties: false
      required: [field, equals]
      properties:
        field: {$ref: '#/components/schemas/FieldBinding'}
        equals:
          oneOf:
            - {type: boolean}
            - {type: string, maxLength: 1024}
    InputPreview:
      type: object
      required: [node_id, state, parameters, error]
      properties:
        node_id: {type: string}
        state: {type: string, enum: [ready, pending, skipped, invalid]}
        parameters: {type: object, additionalProperties: true}
        error: {type: string}
    ForkInput:
      type: object
      additionalProperties: false
      required: [checkpoint_node, workflow]
      properties:
        checkpoint_node: {type: string}
        workflow: {$ref: '#/components/schemas/Workflow'}
    ForkPreview:
      type: object
      required: [reused_nodes, execute_nodes, input_changed]
      properties:
        reused_nodes: {type: array, items: {type: string}}
        execute_nodes: {type: array, items: {type: string}}
        input_changed: {type: boolean}
    Fork:
      type: object
      required: [request_hash, checkpoint_node, commit, origin_commit]
      properties:
        request_hash: {type: string}
        checkpoint_node: {type: string}
        commit: {type: string}
        origin_commit: {type: string}
        checkpoints: {type: object, additionalProperties: {type: string}}
        reused:
          type: object
          additionalProperties:
            type: object
            required: [text, run_id]
            properties:
              text: {type: string}
              run_id: {type: string}
              data: {type: object, additionalProperties: true}
    GithubHookConfig:
      type: object
      additionalProperties: false
