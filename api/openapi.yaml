            error:
              $ref: '#/components/schemas/RunError'
            definition:
              $ref: '#/components/schemas/Workflow'
            source_run_id:
              type: string
              format: uuid
            logs_expired:
              type: boolean
              description: 日志、产物与重跑基准已到期。
    RunList:
