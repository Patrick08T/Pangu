          type: boolean
          enum:
            - true
        layers:
          type: array
          items:
            type: array
            items:
              type: string
    Workflow:
      type: object
      additionalProperties: false
      required:
        - nodes
      properties:
        budget: {$ref: '#/components/schemas/Budget'}
        project_id:
          type: string
          format: uuid
          description: Codex 编排必填；必须为当前命名空间登记的项目
        input:
          type: string
        nodes:
          type: array
          minItems: 1
          maxItems: 32
          items:
            $ref: '#/components/schemas/Node'
        version_id:
          type: string
          format: uuid
        input_schema:
          $ref: '#/components/schemas/Shape'
    Node:
      type: object
      additionalProperties: false
      required:
        - id
        - executor
        - instruction
      properties:
        handoff:
          $ref: '#/components/schemas/HandoffContract'
        when: {$ref: '#/components/schemas/Condition'}
        approval: {$ref: '#/components/schemas/ApprovalPolicy'}
        id:
          type: string
          pattern: ^[a-zA-Z][a-zA-Z0-9_-]{0,63}$
        executor:
          type: string
          enum:
            - eino
            - codex
        instruction:
          type: string
          pattern: \S
          description: 非空，最多 16 KiB
        description:
          type: string
          description: 最多 1 KiB
        model:
          type: string
          pattern: ^$|\S
          maxLength: 128
          description: 无模型连接的 Eino 必填；有连接时须与连接模型一致，Codex 账号连接可留空使用默认模型。
        depends_on:
          type: array
          uniqueItems: true
          items:
            type: string
        agent_version:
          type: string
          format: uuid
        connection_version:
          type: string
          format: uuid
        output_schema:
          $ref: '#/components/schemas/Shape'
        bindings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldBinding'
        policy:
          $ref: '#/components/schemas/Policy'
        role:
          type: string
          enum:
            - product_manager
        mode:
          type: string
          enum:
            - research
            - competition
            - planning
            - design
        read_only:
          type: boolean
          description: 仅 Codex：设置原生 read-only 沙箱；写入变更不能发布检查点。
      oneOf:
        - properties:
            executor:
              type: string
              enum:
                - eino
          anyOf:
            - required: [connection_version]
            - required: [model]
              properties:
                model: {type: string, pattern: '\S'}
        - properties:
            executor:
              type: string
              enum:
                - codex
    HandoffContract:
      type: object
      additionalProperties: false
      description: 交接契约。草稿允许缺项或留空；发布、试运行及新任务提交时五项均须为非空白文本，每项最多 4096 UTF-8 字节。状态、权限和预算由既有运行配置控制，契约描述不授予额外权限。
      properties:
        objective: {type: string, maxLength: 4096, description: 任务目标与职责边界}
        inputs: {type: string, maxLength: 4096, description: 必需输入与上下文}
        deliverables: {type: string, maxLength: 4096, description: 交付物及其格式}
        acceptance: {type: string, maxLength: 4096, description: 可核验的验收标准}
        failure_handling: {type: string, maxLength: 4096, description: 缺失资料与失败时如何处理}
    Shape:
      type: object
      additionalProperties: false
      properties:
        type:
          type: string
          enum:
            - object
            - array
            - string
            - number
            - integer
            - boolean
            - 'null'
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Shape'
        required:
          type: array
          items:
            type: string
        items:
          $ref: '#/components/schemas/Shape'
      required:
        - type
      description: 无引用与脚本的 JSON Schema 子集；对象拒绝未知字段，最多 6 层、每层 64 个字段、整体 16 KiB。
    FieldBinding:
      type: object
      additionalProperties: false
      properties:
        from:
          type: string
        pointer:
          type: string
        type:
          type: string
      required:
        - from
        - pointer
        - type
      description: 只读取 $input 或声明的直接上游；pointer 为 JSON Pointer，无隐式类型转换。
    Connection:
      type: object
      additionalProperties: false
      properties:
        provider:
          type: string
          enum: [openai, codex]
        price: {$ref: '#/components/schemas/Price'}
        base_url:
          type: string
          format: uri
        model:
          type: string
          maxLength: 128
        secret_ref:
          type: string
          pattern: ^PANGU_SECRET_[A-Z][A-Z0-9_]{0,63}$
      oneOf:
        - properties:
            provider: {enum: [openai]}
            model: {minLength: 1}
          required: [base_url, model, secret_ref]
        - properties:
            provider: {enum: [codex]}
          required: [provider]
          not:
            anyOf:
              - required: [base_url]
              - required: [secret_ref]
              - required: [price]
      description: openai 使用服务端凭据引用；codex 使用 Worker 专用登录且模型可留空，禁止配置 API 端点、凭据引用与单价。执行时读取原始来源，不返回密钥。
    FlowBinding:
      type: object
      additionalProperties: false
      properties:
        task: {type: string, description: 本步骤任务，追加到角色指令；最多 8192 字节，合并后指令最多 16384 字节}
        read_only: {type: boolean, description: 仅可收紧为只读，不能解除助手已有的只读权限}
        output_schema: {$ref: '#/components/schemas/Shape'}
        when: {$ref: '#/components/schemas/Condition'}
        approval: {$ref: '#/components/schemas/ApprovalPolicy'}
        id:
          type: string
        agent_version:
          type: string
          format: uuid
        depends_on:
          type: array
          items:
            type: string
        bindings:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/FieldBinding'
      required:
        - id
        - agent_version
    FlowEditor:
      type: object
      additionalProperties: false
      properties:
