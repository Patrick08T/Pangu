openapi: 3.0.3
info:
  title: Pangu 本地 API
  version: 0.1.0
  description: Pangu Agent 工厂 API。飞书会话或项目 API Token 认证；仅 healthz 与飞书授权入口公开。配置权限与会话每次查询原始数据库。
servers:
  - url: /api
paths:
  /projects:
    get:
      operationId: listProjects
      responses:
        '200':
          description: 当前命名空间已登记的项目
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
    post:
      operationId: registerProject
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectRegistration'
      responses:
        '201':
          description: 项目已登记，执行前在绑定 Worker 校验源目录
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      parameters:
        - name: X-CSRF-Token
          in: header
          description: 浏览器会话修改操作必填，取自 /auth/me；同时必须提供与 PANGU_PUBLIC_URL 完全一致的 Origin。API Token 无此要求。
          schema:
            type: string
  /healthz:
    get:
      operationId: getHealth
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /readyz:
    get:
      operationId: getReadiness
      responses:
        '200':
          $ref: '#/components/responses/Readiness'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Readiness'
  /openapi.yaml:
    get:
      operationId: getContract
      responses:
        '200':
          description: 当前 API 契约
          content:
            application/yaml:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /workflows/validate:
    post:
      operationId: validateWorkflow
      requestBody:
        $ref: '#/components/requestBodies/Workflow'
      responses:
        '200':
          description: 仅校验定义，返回稳定分层；不访问模型或调度任务
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Validation'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
      parameters:
        - name: X-CSRF-Token
          in: header
          description: 浏览器会话修改操作必填，取自 /auth/me；同时必须提供与 PANGU_PUBLIC_URL 完全一致的 Origin。API Token 无此要求。
          schema:
            type: string
  /runs:
    get:
      operationId: listRuns
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum:
              - queued
              - running
              - succeeded
              - failed
              - cancelled
              - cancelling
        - name: since
          in: query
          schema:
            type: string
            format: date-time
        - name: until
          in: query
          schema:
            type: string
            format: date-time
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
          description: 按项目筛选，同时检查当前身份授权。
      responses:
        '200':
          description: 当前命名空间的根运行；后续页沿用返回的 since/until，状态仍实时变化
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
    post:
      operationId: submitRun
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - name: X-CSRF-Token
          in: header
          description: 浏览器会话修改操作必填，取自 /auth/me；同时必须提供与 PANGU_PUBLIC_URL 完全一致的 Origin。API Token 无此要求。
          schema:
            type: string
      requestBody:
        $ref: '#/components/requestBodies/Workflow'
      responses:
        '202':
          description: 提交意图已持久化；pending 代表等待交接/对账，accepted 才有 run_id；不表示执行完成
          headers:
            Location:
              schema:
                type: string
              description: 提交请求查询地址
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /requests/{id}:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: getSubmission
      responses:
        '200':
          description: 当前命名空间的持久提交请求
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /workflows/preflight:
    post:
      operationId: preflightWorkflow
      requestBody:
        $ref: '#/components/requestBodies/Workflow'
      responses:
        '200':
          $ref: '#/components/responses/Preflight'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Preflight'
      parameters:
        - name: X-CSRF-Token
          in: header
          description: 浏览器会话修改操作必填，取自 /auth/me；同时必须提供与 PANGU_PUBLIC_URL 完全一致的 Origin。API Token 无此要求。
          schema:
            type: string
  /runs/{id}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: X-CSRF-Token
          in: header
          description: 浏览器会话修改操作必填，取自 /auth/me；同时必须提供与 PANGU_PUBLIC_URL 完全一致的 Origin。API Token 无此要求。
          schema:
            type: string
      responses:
        '202':
          description: 已受理取消意图；终态运行返回 requested=false；不代表执行器已经停止
          content:
            application/json:
              schema:
                type: object
                required:
                  - run_id
                  - requested
                properties:
                  run_id:
                    type: string
                    format: uuid
                  requested:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /runs/{id}:
    get:
      operationId: getRun
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: 当前命名空间的根运行及直接子节点；刚提交的运行可能暂时未同步
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunDetails'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /runs/{id}/attempts:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listAttempts
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: 尝试摘要；完整日志及原生命令证据通过尝试详情获取
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /runs/{id}/nodes/{node}/attempts/{attempt}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - name: node
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: attempt
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      operationId: getAttempt
      responses:
        '200':
          description: 已脱敏的单次执行诊断和原生命令证据；不包含内部推理
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attempt'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /runs/{id}/artifacts:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listArtifacts
      responses:
        '200':
          description: 当前成功检查点到原基准的不可变文件清单
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactManifest'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /runs/{id}/artifacts/{artifact}:
    parameters:
      - $ref: '#/components/parameters/ID'
      - name: artifact
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$
    get:
      operationId: downloadArtifact
      responses:
        '200':
          description: 最大 10 MiB；附件下载，不执行 HTML 或其他活动内容
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
            text/plain:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /runs/{id}/artifacts/{artifact}/diff:
    parameters:
      - $ref: '#/components/parameters/ID'
      - name: artifact
        in: path
        required: true
        schema:
          type: string
          pattern: ^(?:[a-f0-9]{32}|[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})$
    get:
      operationId: getArtifactDiff
      responses:
        '200':
          description: 最多 1 MiB 的文本差异；二进制只有文件元数据
          content:
            application/json:
              schema:
                type: object
                required:
                  - file
                  - diff
                  - truncated
                properties:
                  file:
                    $ref: '#/components/schemas/ArtifactFile'
                  diff:
                    type: string
                  truncated:
                    type: boolean
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /runs/{id}/artifacts.zip:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: exportArtifacts
      responses:
        '200':
          description: ZIP 包含新/修改文件及删除清单；最大 100 MiB 原始数据、1000 个产物；遇疑似凭据整包拒绝
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '410':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /crons:
    get:
      operationId: listCrons
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            format: int64
            minimum: 0
            default: 0
        - name: project_id
          in: query
          schema:
            type: string
            format: uuid
          description: 按项目筛选，同时检查当前身份授权。
      responses:
        '200':
          description: 按权限过滤；空页仍可能存在 next_offset。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CronPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
    post:
      operationId: createCron
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - name
                - expression
                - workflow
              properties:
                name:
                  type: string
                  description: 显示名称，可含中文和空格；UTF-8 最多128字节，不含控制字符。
                  minLength: 1
                  maxLength: 128
                expression:
                  type: string
                  description: UTC 五字段表达式
                workflow:
                  $ref: '#/components/schemas/Workflow'
      responses:
        '201':
          description: 计划已持久登记并注册到 Hatchet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '413':
          $ref: '#/components/responses/Error'
        '415':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      parameters:
        - name: X-CSRF-Token
          in: header
          description: 浏览器会话修改操作必填，取自 /auth/me；同时必须提供与 PANGU_PUBLIC_URL 完全一致的 Origin。API Token 无此要求。
          schema:
            type: string
  /crons/{id}:
    delete:
      operationId: deleteCron
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: X-CSRF-Token
          in: header
          description: 浏览器会话修改操作必填，取自 /auth/me；同时必须提供与 PANGU_PUBLIC_URL 完全一致的 Origin。API Token 无此要求。
          schema:
            type: string
      responses:
        '204':
          description: 已删除，不取消已触发运行
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
    put:
      operationId: editCron
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: X-CSRF-Token
          in: header
          description: 浏览器会话修改操作必填，取自 /auth/me；同时必须提供与 PANGU_PUBLIC_URL 完全一致的 Origin。API Token 无此要求。
          schema:
            type: string
      responses:
        '200':
          description: 操作结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                revision:
                  type: integer
                paused:
                  type: boolean
                cron:
                  type: object
                  additionalProperties: false
                  required:
                    - name
                    - expression
                    - workflow
                  properties:
                    name:
                      type: string
                      pattern: ^[a-zA-Z][a-zA-Z0-9_-]{0,63}$
                    expression:
                      type: string
                      description: UTC 五字段表达式
                    workflow:
                      $ref: '#/components/schemas/Workflow'
              required:
                - revision
                - paused
                - cron
    get:
      operationId: getCron
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: 读取计划原始状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /crons/{id}/fires:
    parameters:
      - $ref: '#/components/parameters/ID'
    get:
      operationId: listScheduleFires
      parameters:
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: 逐次触发与跳过记录，每页最多 100 条
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleFire'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
  /catalog:
    get:
      operationId: listCatalog
      parameters:
        - name: kind
          in: query
          schema:
            type: string
        - name: project_id
          in: query
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        '200':
          description: 按权限过滤；空页仍可能存在 next_offset。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPage'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '502':
          $ref: '#/components/responses/Error'
    post:
      operationId: createCatalog
      parameters:
        - name: X-CSRF-Token
          in: header
          description: 浏览器会话修改操作必填，取自 /auth/me；同时必须提供与 PANGU_PUBLIC_URL 完全一致的 Origin。API Token 无此要求。
          schema:
            type: string
      responses:
        '201':
          description: 操作结果
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogObject'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
